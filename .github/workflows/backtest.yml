name: VISH_SCAN Backtest

# Manual trigger only — click "Run workflow" in the Actions tab when you want results.
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run backtest
        run: python backtest_vish_scan.py

      - name: Upload results as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_signals.csv